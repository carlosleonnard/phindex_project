    <!-- Structured Data for Organization and Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.phenotypeindex.com/#organization",
          "name": "Phindex",
          "alternateName": ["Phindex - Phenotype Index", "Phenotype Index"],
          "url": "https://www.phenotypeindex.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.phenotypeindex.com/logo-square.png",
            "width": 512,
            "height": 512
          },
          "description": "The only phenotype database for classifying and indexing physical traits of famous people and individuals.",
          "sameAs": [
            "https://www.phenotypeindex.com"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.phenotypeindex.com/#website",
          "name": "Phindex",
          "alternateName": "Phenotype Index",
          "url": "https://www.phenotypeindex.com",
          "description": "The only phenotype database. Discover, classify, and index famous people and your friends by their unique traits.",
          "publisher": {
            "@id": "https://www.phenotypeindex.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.phenotypeindex.com/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
