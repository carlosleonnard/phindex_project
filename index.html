    <!-- Vollkorn, servida pelo proprio site: o texto do heroi e o LCP da home e
         esperava por uma origem de terceiros. Preload so do peso que a primeira
         tela usa; o resto vem pelo CSS. -->
    <link rel="preload" href="/fonts/vollkorn-normal-400-900-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Structured Data for Organization and Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.phenotypeindex.com/#organization",
          "name": "Phindex",
          "alternateName": ["Phindex - Phenotype Index", "Phenotype Index"],
          "url": "https://www.phenotypeindex.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.phenotypeindex.com/logo-square.png",
            "width": 512,
            "height": 512
          },
          "description": "A community project where people vote on how they read human faces: region, phenotype and ten physical traits.",
          "foundingDate": "2026",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "contact@phenotypeindex.com",
            "contactType": "customer support",
            "url": "https://www.phenotypeindex.com/contact"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.phenotypeindex.com/#website",
          "name": "Phindex",
          "alternateName": "Phenotype Index",
          "url": "https://www.phenotypeindex.com",
          "description": "Compare and vote on human phenotypes from around the world.",
          "publisher": {
            "@id": "https://www.phenotypeindex.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.phenotypeindex.com/explore?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
