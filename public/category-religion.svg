<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <circle cx="200" cy="200" r="180" fill="#7c3aed" opacity="0.05"/>
  <circle cx="200" cy="200" r="130" fill="#6d28d9" opacity="0.04"/>
  <!-- Cross -->
  <rect x="115" y="80" width="12" height="100" rx="3" fill="#475569" opacity="0.4"/>
  <rect x="95" y="105" width="52" height="12" rx="3" fill="#475569" opacity="0.4"/>
  <!-- Crescent -->
  <path d="M280 120 A40 40 0 1 1 280 200 A30 30 0 1 0 280 120Z" stroke="#475569" stroke-width="2.5" fill="none" opacity="0.4"/>
  <!-- Star of David -->
  <polygon points="200,240 215,265 185,265" stroke="#475569" stroke-width="2" fill="none" opacity="0.4"/>
  <polygon points="200,275 185,250 215,250" stroke="#475569" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Om symbol circle -->
  <circle cx="320" cy="300" r="25" stroke="#475569" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Dharma wheel -->
  <circle cx="100" cy="300" r="25" stroke="#475569" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="100" cy="300" r="3" fill="#475569" opacity="0.3"/>
  <line x1="100" y1="275" x2="100" y2="325" stroke="#475569" stroke-width="1.5" opacity="0.3"/>
  <line x1="75" y1="300" x2="125" y2="300" stroke="#475569" stroke-width="1.5" opacity="0.3"/>
  <line x1="82" y1="282" x2="118" y2="318" stroke="#475569" stroke-width="1.5" opacity="0.3"/>
  <line x1="118" y1="282" x2="82" y2="318" stroke="#475569" stroke-width="1.5" opacity="0.3"/>
  <!-- Light rays -->
  <circle cx="200" cy="160" r="100" stroke="#64748b" stroke-width="0.8" fill="none" opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="200" cy="160" r="140" stroke="#64748b" stroke-width="0.5" fill="none" opacity="0.1" stroke-dasharray="4 8"/>
</svg>
